name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, epic/drill-down-ui]

jobs:
  cli-tests:
    name: CLI (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sysvista-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sysvista-analyzer/package-lock.json
      - run: npm ci
        working-directory: sysvista-analyzer
      - run: npm run typecheck
        working-directory: sysvista-analyzer
      - run: npm test
        working-directory: sysvista-analyzer
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sysvista-cli
      - run: cargo build
      - run: cargo test
      - run: ../scripts/validate-corpus.sh

  web-tests:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sysvista-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sysvista-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vitest run src/lib/projection/project.test.ts --maxWorkers=1
        env:
          SYSVISTA_RUN_PROJECTION_BENCHMARK: "1"

  schema-generated:
    name: Generated v2 schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sysvista-analyzer/package-lock.json
            sysvista-web/package-lock.json
      - run: npm ci
        working-directory: sysvista-analyzer
      - run: npm run build
        working-directory: sysvista-analyzer
      - run: npm ci
        working-directory: sysvista-web
      - run: ./scripts/regen-schema.sh
      - run: git diff --exit-code -- schema/sysvista-v2.schema.json sysvista-web/src/types/v2.generated.ts
