[package]
name = "sysvista-cli"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ignore = "0.4"
globset = "0.4"
regex = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
